<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="ARNOLD SCHWARTZENIGGA MINING — Telegram Mini App" />
    <title>ARNOLD SCHWARTZENIGGA MINING</title>
    <script>
      (function () {
        var overlay;
        var timeout;
        function show(message, detail) {
          if (!overlay) {
            overlay = document.createElement('section');
            overlay.id = 'arnold-startup-diagnostic';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#090909;color:#f4f0e7;padding:28px 20px;font:15px/1.5 Arial,sans-serif;overflow:auto';
            document.body.appendChild(overlay);
          }
          overlay.innerHTML = '<h1 style="color:#f0b64b;font-size:24px">ARNOLD — problema de inicio</h1><p></p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#1b1711;border:1px solid #8a642e;border-radius:10px;padding:14px"></pre><p>Recarga la página después de compartir este mensaje.</p>';
          overlay.querySelector('p').textContent = message;
          overlay.querySelector('pre').textContent = detail || 'Sin detalle adicional del navegador.';
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target !== window) {
            show('No se pudo cargar un recurso necesario.', target.src || target.href || target.tagName || 'Recurso desconocido');
          } else {
            show('Ocurrió un error de JavaScript antes de iniciar la interfaz.', event.message || 'Error sin mensaje');
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          show('Falló una operación de JavaScript al iniciar.', reason && (reason.stack || reason.message) || String(reason));
        });
        document.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (!root) {
            show('No se encontró el contenedor principal (#root).');
            return;
          }
          timeout = window.setTimeout(function () {
            if (overlay) return;
            if (!root.hasChildNodes()) {
              show('La interfaz no respondió después de 12 segundos. El módulo principal puede no haberse descargado o ejecutado.', 'Comprueba la conexión y comparte esta pantalla para identificar el fallo.');
            }
          }, 12000);
          var observer = new MutationObserver(function () {
            if (root.hasChildNodes()) {
              if (timeout) window.clearTimeout(timeout);
              if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        });
      })();
    </script>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
